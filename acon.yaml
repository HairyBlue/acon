# ==============================================================================
# ACON (Agentic Conventions & Orchestration Network) Master Configuration
# ==============================================================================
version: "1.0"

# Cross-Harness Bridge Configuration (External Model Dispatching)
# Note: The Control Plane is the permanent constitution of ACON and is never enabled/disabled.
# This section strictly configures the external bridge adapter layer.
bridge:
  enabled: true # true: dispatch via adapter bridge (dispatch.sh) | false: native invoke_subagent
  prefer_main_first: true # Prefer main model by default; only escalate to specialized models when task complexity demands it
  activation_gate: "explicit_or_heavy_only" # "always" | "explicit_or_heavy_only"
  # Main-First Escalation Invariant: Routine coding, straightforward tests, simple scripts,
  # and normal scans should execute on the main engine (main_model), reserving heavy external
  # models for tasks that genuinely require deep reasoning or specialized capability.
  mode: "cli"   # Supported modes: "cli" | "app" | "ide"
  default_harness: "agy"
  default_effort: "auto"
  main_model: "gemini-3.8-flash"
  bridge_dir: "adapters/sessions/bridge"
  timeout_seconds: 600

# Model Governance & Exclusion Policy
models:
  # Available Models in CLI environment:
  #   gemini-3.8-flash (Fast Control Plane, universal fallback & quick scans)
  #   claude-opus-4-6 (Deepest reasoning / effort: auto -> high)
  #   claude-sonnet-4-6 (Core coding & TDD / effort: auto -> high)
  #   gpt-oss-120b (Web research & spikes / effort: auto -> medium capped)
  #
  # Models explicitly disallowed across all harnesses.
  # The dispatch layer enforces this policy and aborts if any match is requested.
  exclude:
    - "gemini-3.1-pro"
    - "gemini-3.6-flash"
    - "gemini-3.7-flash"

# Dispatch Routing Rules: Intent keyword matching to target harness and model
dispatch:
  rules:
    - name: "research-scout"
      description: "Read-only exploration, codebase archaeology, feasibility spikes, and diagnostic investigations"
      match: "deep-research|external-benchmark|oss-analysis"
      harness: "agy"
      model: "gpt-oss-120b"
      fallback: "gemini-3.8-flash"
      effort: "auto"

    - name: "architecture-deep-reasoning"
      description: "Complex system design, deep reasoning, security audits, and structural refactoring"
      match: "architecture|deep-thinking|security-audit|refactor"
      harness: "agy"
      model: "claude-opus-4-6"
      fallback: "gemini-3.8-flash"
      effort: "auto"

    - name: "core-implementation-tdd"
      description: "Production code changes, feature implementation, and test-driven development"
      match: "ship|implement|tdd"
      harness: "agy"
      model: "claude-sonnet-4-6"
      fallback: "gemini-3.8-flash"
      effort: "auto"

    - name: "mechanical-formatting"
      description: "Mechanical transformations, boilerplate generation, code formatting, and linting"
      match: "mechanical|formatting|lint"
      harness: "agy"
      model: "claude-sonnet-4-6"
      fallback: "gemini-3.8-flash"
      effort: "auto"
